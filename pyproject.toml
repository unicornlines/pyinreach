[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyinreach"
dynamic = ["version"]
description = "Typed Python client for the Garmin inReach IPC (Portal Connect) inbound and outbound APIs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Unicornlines", email = "hello@unicornlines.de" }]
keywords = ["garmin", "inreach", "ipc", "satellite", "iridium", "messaging", "tracking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/unicornlines/pyinreach"
Repository = "https://github.com/unicornlines/pyinreach"
Issues = "https://github.com/unicornlines/pyinreach/issues"

[tool.hatch.version]
path = "src/pyinreach/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pyinreach"]

[tool.hatch.build.targets.sdist]
include = ["src/pyinreach", "tests", "README.md", "THREAT_MODEL.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["pyinreach"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "C4", "SIM", "RUF"]
ignore = ["B904"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/pyinreach"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
